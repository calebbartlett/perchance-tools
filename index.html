<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perchance Export Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="editor.js"></script>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: 300px 1fr 1fr;
        height: 100vh;
    }

    #leftPanel, #middlePanel, #rightPanel {
        padding: 10px;
        overflow-y: auto;
        border-right: 1px solid #ccc;
    }

    #rightPanel { border-right: none; }

    h2 { margin-top: 0; }

    input, textarea {
        width: 100%;
        margin-bottom: 10px;
        padding: 6px;
        font-size: 14px;
    }

    button {
        padding: 8px 12px;
        margin: 5px 0;
        width: 100%;
        font-size: 14px;
    }

    #status {
        margin-top: 10px;
        font-weight: bold;
        color: #444;
    }
</style>
</head>

<body>

<!-- LEFT PANEL: Import + Raw JSON -->
<div id="leftPanel">
    <h2>Import Export</h2>
    <input type="file" id="fileInput">
    <button id="loadBtn">Load Export</button>

    <h3>Raw JSON</h3>
    <pre id="rawJson" style="white-space: pre-wrap; background:#f0f0f0; padding:10px;"></pre>
</div>

<!-- MIDDLE PANEL: Character Profile -->
<div id="middlePanel">
    <h2>Character Profile</h2>

    <label>Name</label>
    <input id="charName">

    <label>Description</label>
    <textarea id="charDescription" rows="4"></textarea>

    <label>Personality</label>
    <textarea id="charPersonality" rows="4"></textarea>

    <label>Role Instructions</label>
    <textarea id="charRoleInstructions" rows="4"></textarea>

    <label>Greeting</label>
    <textarea id="charGreeting" rows="4"></textarea>

    <button id="applyChangesBtn">Apply Changes</button>

    <div id="status"></div>
</div>

<!-- RIGHT PANEL: Export Tools -->
<div id="rightPanel">
    <h2>Export Tools</h2>
    <button id="downloadUpdatedBtn">Download Updated Export</button>
</div>

</body>
</html>
