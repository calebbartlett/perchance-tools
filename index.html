<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarHamr Studio</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #f4f4f4;
  }

  header {
    background: #333;
    color: white;
    padding: 1rem;
    text-align: center;
  }

  #tabs {
    display: flex;
    background: #444;
  }

  .tab-button {
    flex: 1;
    padding: 1rem;
    color: white;
    background: #444;
    border: none;
    cursor: pointer;
    text-align: center;
  }

  .tab-button:hover {
    background: #555;
  }

  .tab-panel {
    display: none;
    padding: 1rem;
    background: white;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
  }

  input[type="text"], select {
    width: 100%;
    padding: 0.5rem;
    margin-bottom: 1rem;
  }

  button {
    padding: 0.5rem 1rem;
    margin-top: 0.5rem;
  }
</style>
</head>

<body>

<header>
  <h1>SmarHamr Studio</h1>
</header>

<!-- ========================= -->
<!-- TAB BUTTONS -->
<!-- ========================= -->
<div id="tabs">
  <button class="tab-button" data-target="profiles">Profiles</button>
  <button class="tab-button" data-target="memories">Memories</button>
  <button class="tab-button" data-target="lore">Lore</button>
  <button class="tab-button" data-target="viewer">Viewer</button>
</div>

<!-- ========================= -->
<!-- PROFILES TAB -->
<!-- ========================= -->
<div id="profiles" class="tab-panel">
  <h2>Profiles</h2>

  <input type="file" id="loadExportBtn">
  <button id="saveExportBtn">Save Export</button>

  <p>Profiles tab placeholder — your existing profile editor goes here.</p>
</div>

<!-- ========================= -->
<!-- MEMORIES TAB (FULLY FUNCTIONAL) -->
<!-- ========================= -->
<div id="memories" class="tab-panel">
  <h2>Memories</h2>

  <!-- CHARACTER SELECTOR -->
  <label><strong>Select Character:</strong></label>
  <select id="memoryCharacterSelect"></select>

  <!-- SEARCH BAR -->
  <label><strong>Search Memories:</strong></label>
  <input id="memorySearch" type="text" placeholder="Search memories...">

  <!-- MEMORY EDITOR -->
  <label><strong>Memory Editor:</strong></label>
  <textarea id="memoryEditor" rows="15"></textarea>

  <!-- ADD NEW MEMORY -->
  <label><strong>Add New Memory:</strong></label>
  <input id="newMemoryText" type="text" placeholder="New memory text">
  <button id="addMemoryBtn">Add Memory</button>

  <!-- SAVE BUTTON -->
  <button id="saveMemoryBtn">Save All Changes</button>
</div>

<!-- ========================= -->
<!-- LORE TAB -->
<!-- ========================= -->
<div id="lore" class="tab-panel">
  <h2>Lore</h2>
  <p>Lore editor placeholder.</p>
</div>

<!-- ========================= -->
<!-- VIEWER TAB -->
<!-- ========================= -->
<div id="viewer" class="tab-panel">
  <h2>Viewer</h2>
  <p>Viewer placeholder.</p>
</div>

<!-- ========================= -->
<!-- JS FILE -->
<!-- ========================= -->
<script src="editor.js"></script>

</body>
</html>
